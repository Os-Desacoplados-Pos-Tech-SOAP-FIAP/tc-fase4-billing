apiVersion: v1
kind: ServiceAccount
metadata:
  name: billing
  labels:
    app.kubernetes.io/name: billing
    app.kubernetes.io/part-of: oficina-fase4
  annotations:
    # IRSA: o pod recebe credenciais temporárias da role oficina-fase4-billing (SQS/SNS).
    # ${IRSA_ROLE_ARN} é preenchido pelo CD (envsubst) com o output irsa_role_arn.
    eks.amazonaws.com/role-arn: ${IRSA_ROLE_ARN}
